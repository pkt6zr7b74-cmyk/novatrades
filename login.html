<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Novatrades</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0b0f14;
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .box {
            width: 100%;
            max-width: 420px;
            background: #10151c;
            border: 1px solid #202832;
            border-radius: 16px;
            padding: 35px;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 30px;
        }

        .logo span {
            color: #2ecc71;
        }

        h1 {
            margin-bottom: 10px;
        }

        p {
            color: #9ca6b2;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin: 15px 0 8px;
        }

        input {
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            border: 1px solid #303945;
            background: #0b0f14;
            color: white;
            font-size: 16px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            border: 0;
            border-radius: 8px;
            background: #2ecc71;
            font-weight: bold;
            font-size: 16px;
        }

        .back {
            display: block;
            margin-top: 20px;
            text-align: center;
            color: #9ca6b2;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="box">

    <div class="logo">
        Nova<span>trades</span>
    </div>

    <h1>Welcome back</h1>

    <p>Login to your Novatrades account.</p>

    <form>
        <label>Email</label>
        <input type="email" placeholder="Enter your email">

        <label>Password</label>
        <input type="password" placeholder="Enter your password">

        <button type="submit">Login</button>
    </form>

    <a class="back" href="index.html">
        ← Back to Novatrades
    </a>

</div>

</body>
</html>
